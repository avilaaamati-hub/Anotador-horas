<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Anotador de Horas</title>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e90ff">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  padding: 10px;
}
h2 { text-align: center; }
.boton {
  font-size: 1.4em;
  padding: 20px;
  margin: 15px auto;
  background: #1e90ff;
  border-radius: 15px;
  width: 95%;
  text-align: center;
}
.nav {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.9em;
}
th, td {
  border: 1px solid #444;
  padding: 6px;
  text-align: center;
}
.hoy {
  background: #1e90ff44;
}
</style>
</head>

<body>

<h2 id="titulo"></h2>

<div class="nav">
  <button onclick="cambiarMes(-1)">◀</button>
  <button onclick="cambiarMes(1)">▶</button>
</div>

<div class="boton" id="boton">TOCAR PARA INICIAR</div>
<div id="tiempo" style="text-align:center">00:00:00</div>

<table id="tabla"></table>

<script>
let inicio = null;
let corriendo = false;
let intervalo = null;

const meses = ["Enero","Febrero","Marzo","Abril","Mayo","Junio",
               "Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

let hoy = new Date();
let mesActual = hoy.getMonth();
let anioActual = hoy.getFullYear();

function clave(dia, tipo, mes, anio) {
  return `${anio}_${mes}_${dia}_${tipo}`;
}

function diasDelMes(m, a) {
  return new Date(a, m + 1, 0).getDate();
}

function redondear(horas) {
  if (horas < 1.25) return 1;
  return Math.round(horas * 2) / 2;
}

function formato(ms) {
  let s = Math.floor(ms / 1000);
  let h = String(Math.floor(s / 3600)).padStart(2,"0");
  let m = String(Math.floor((s % 3600) / 60)).padStart(2,"0");
  let se = String(s % 60).padStart(2,"0");
  return `${h}:${m}:${se}`;
}

function cargarMes() {
  hoy = new Date();
  document.getElementById("titulo").textContent =
    meses[mesActual] + " " + anioActual;

  let tabla = document.getElementById("tabla");
  tabla.innerHTML = "<tr><th>Día</th><th>Horas</th><th>Extra</th></tr>";

  let totalDias = diasDelMes(mesActual, anioActual);

  for (let d = 1; d <= totalDias; d++) {
    let normal = localStorage.getItem(clave(d,"normal",mesActual,anioActual)) || 0;
    let extra  = localStorage.getItem(clave(d,"extra",mesActual,anioActual)) || 0;

    let fila = tabla.insertRow();
    if (d === hoy.getDate() && mesActual === hoy.getMonth()) {
      fila.classList.add("hoy");
    }
    fila.insertCell().textContent = d;
    fila.insertCell().textContent = normal;
    fila.insertCell().textContent = extra;
  }
}

cargarMes();

function cambiarMes(dir) {
  mesActual += dir;
  if (mesActual < 0) { mesActual = 11; anioActual--; }
  if (mesActual > 11) { mesActual = 0; anioActual++; }
  cargarMes();
}

document.getElementById("boton").onclick = () => {
  if (!corriendo) {
    inicio = Date.now();
    corriendo = true;
    document.getElementById("boton").textContent = "TOCAR PARA FINALIZAR";
    intervalo = setInterval(() => {
      document.getElementById("tiempo").textContent =
        formato(Date.now() - inicio);
    }, 1000);
  } else {
    corriendo = false;
    clearInterval(intervalo);

    let horas = redondear((Date.now() - inicio) / 3600000);
    let ahora = new Date();
    let dia = ahora.getDate();
    let diaSemana = ahora.getDay();

    let limite = 0;
    if (diaSemana >= 1 && diaSemana <= 5) limite = 8;
    else if (diaSemana === 6) limite = 5;

    let normal = Number(localStorage.getItem(clave(dia,"normal",mesActual,anioActual))) || 0;
    let extra  = Number(localStorage.getItem(clave(dia,"extra",mesActual,anioActual))) || 0;

    let total = normal + horas;
    if (total > limite) {
      extra += total - limite;
      total = limite;
    }

    localStorage.setItem(clave(dia,"normal",mesActual,anioActual), total);
    localStorage.setItem(clave(dia,"extra",mesActual,anioActual), extra);

    cargarMes();
    document.getElementById("boton").textContent = "TOCAR PARA INICIAR";
    document.getElementById("tiempo").textContent = "00:00:00";
  }
};
</script>

</body>
  </html>
